server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the internal backend (backend is NOT publicly exposed).
    # Backend runs on the shared docker network "sila-net". Resolve it at RUNTIME via
    # docker's embedded DNS (127.0.0.11) using a variable, so nginx starts even if the
    # backend is momentarily unavailable (no crash-loop).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sila_backend sila-fatoora-backend-prod:7776;
        proxy_pass http://$sila_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}
